<mat-sidenav-container class="shell">
  <mat-sidenav class="sidebar" mode="side" opened>
    <div class="brand">
      <span class="brand-mark">OB</span>
      <div>
        <strong>OpsBoard</strong>
        <span>Painel operacional</span>
      </div>
    </div>

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        @if (item.visible) {
          <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <span class="topbar-title">Operações internas</span>
      <span class="spacer"></span>
      @if (auth.currentUser(); as user) {
        <button
          mat-icon-button
          type="button"
          class="user-menu-trigger"
          aria-label="Abrir menu do usuário"
          [matMenuTriggerFor]="userMenu"
        >
          <span class="material-icons-outlined" aria-hidden="true">account_circle</span>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before" class="user-menu">
          <div class="user-menu-summary">
            <strong>{{ user.name }}</strong>
            <span>{{ roleLabels[user.role] }}</span>
          </div>
          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
