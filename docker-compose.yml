services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsboard}
      POSTGRES_USER: ${POSTGRES_USER:-opsboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsboard} -d ${POSTGRES_DB:-opsboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /app
    command: sh -c "composer install && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_NAME: OpsBoard
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-opsboard}
      DB_USERNAME: ${POSTGRES_USER:-opsboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-opsboard}
      SESSION_DRIVER: database
      SESSION_DOMAIN: localhost
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-4200},127.0.0.1:${FRONTEND_PORT:-4200}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-4200},http://127.0.0.1:${FRONTEND_PORT:-4200}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200"
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-vendor:
  frontend-node-modules:
